services:
  - type: web
    name: kejalink
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://kejalink-1-ft8q.onrender.com
      - key: MPESA_ENV
        value: simulate
  - type: web
    name: kejalink-1-ft8q
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kejalink-ipe1.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://kejalink-ipe1.onrender.com/uploads/*
      - type: rewrite
        source: /api-docs.json
        destination: https://kejalink-ipe1.onrender.com/api-docs.json
      - type: rewrite
        source: /api-docs
        destination: https://kejalink-ipe1.onrender.com/api-docs
      - type: rewrite
        source: /swagger
        destination: https://kejalink-ipe1.onrender.com/swagger
      - type: rewrite
        source: /swagger.html
        destination: https://kejalink-ipe1.onrender.com/swagger.html
      - type: rewrite
        source: /swagger-ui-assets/*
        destination: https://kejalink-ipe1.onrender.com/swagger-ui-assets/*
      - type: rewrite
        source: /*
        destination: /index.html
